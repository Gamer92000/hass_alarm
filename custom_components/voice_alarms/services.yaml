add_alarm:
  fields:
    target:
      required: true
      selector:
        entity:
          domain: assist_satellite
    time:
      required: true
      example: "06:30"
      selector:
        time:
    date:
      example: "2026-09-08"
      selector:
        text:
    weekdays:
      example: '["mon", "tue", "wed", "thu", "fri"]'
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    name:
      example: "Work"
      selector:
        text:
    message:
      example: "Take out the trash"
      selector:
        text:
    kind:
      selector:
        select:
          options:
            - alarm
            - reminder
    duration:
      example: 300
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    sound:
      example: "media-source://media_source/local/alarm.mp3"
      selector:
        text:
    enabled:
      default: true
      selector:
        boolean:

