name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Home Assistant 2026.10 needs Python >= 3.14.2; uv installs a standalone build
      # and creates .venv with it.
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements_test.txt

      - name: Install test requirements
        run: |
          uv pip install -r requirements_test.txt
          # Native audio helpers used by assist_pipeline; the test suite stubs
          # them when no wheel is available for the runner.
          uv pip install pymicro-vad==1.0.1 pyspeex-noise==1.0.2 \
            || echo "pymicro-vad / pyspeex-noise not installable here, tests will stub them"

      - name: Lint
        run: |
          .venv/bin/ruff check custom_components tests tools
          .venv/bin/ruff format --check custom_components tests tools

      - name: Test
        run: .venv/bin/pytest -q -p no:cacheprovider --timeout 120
